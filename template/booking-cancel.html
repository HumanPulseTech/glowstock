<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annuler une réservation</title><body><main><h1>Annuler votre réservation</h1><p id="message">Vérification…</p><button id="cancel" hidden>Confirmer l’annulation</button></main><script>const token=new URLSearchParams(location.search).get('token');const m=document.getElementById('message'),b=document.getElementById('cancel');if(!token){m.textContent='Lien invalide.'}else{m.textContent='Souhaitez-vous annuler ce rendez-vous ?';b.hidden=false;b.onclick=async()=>{const r=await fetch('/api/booking/cancel/'+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),d=await r.json().catch(()=>({}));m.textContent=r.ok?'Votre réservation est annulée.':(d.error||'Annulation impossible.');b.hidden=true}}</script></body></html>
