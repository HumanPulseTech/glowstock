<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réservations — GlowStock</title><style>body{font:16px system-ui;margin:40px;max-width:650px;color:#26342b}label{display:grid;gap:6px;margin:16px 0}input{padding:10px;border:1px solid #ccc;border-radius:8px}button{padding:12px 16px;border:0;border-radius:8px;background:#829a85;color:white;font-weight:bold}.msg{min-height:24px}</style></head><body><a href="/dashboard/">← Tableau de bord</a><h1>Réservation en ligne</h1><p>Active ta page publique quand tes prestations et tes horaires sont prêts.</p><form id="settings"><label>Adresse publique<input name="slug" required pattern="[a-z0-9-]{3,80}" placeholder="mon-salon"></label><label>Temps entre deux rendez-vous (minutes)<input name="bufferMinutes" type="number" min="0" max="120" value="0"></label><label>Annulation jusqu’à (heures avant)<input name="cancellationHours" type="number" min="0" max="720" value="24"></label><label><input name="enabled" type="checkbox"> Activer les réservations publiques</label><button>Enregistrer</button></form><h2>Fermetures et congés</h2><form id="closure"><label>Date<input name="date" type="date" required></label><label>Motif (facultatif)<input name="reason" maxlength="150" placeholder="Congés"></label><button>Bloquer cette date</button></form><div id="closures"></div><p id="msg" class="msg"></p><p id="link"></p><script src="/js/reservations.js"></script></body></html>
