<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fidélité — GlowStock</title><body><main><a href="/dashboard/">← Tableau de bord</a><h1>Fidélité & cartes cadeaux</h1><p>Les mouvements automatiques restent désactivés tant que la Caisse est en simulation.</p><form id="settings"><label>Points par euro <input name="pointsPerEuro" type="number" min="1" value="1"></label><label>Points pour récompense <input name="rewardPoints" type="number" min="1" value="100"></label><label>Valeur récompense (€) <input name="rewardAmount" value="5,00"></label><label>Expiration (jours, facultatif) <input name="expiresAfterDays" type="number" min="1"></label><label><input name="enabled" type="checkbox"> Activer le programme</label><button>Enregistrer</button></form><h2>Créer une carte cadeau</h2><form id="card"><label>Montant (€) <input name="amount" value="25,00" required></label><label>Expiration <input name="expiresAt" type="date"></label><button>Créer la carte</button></form><p id="message"></p><h2>Cartes récentes</h2><div id="cards"></div></main><script src="/js/loyalty.js"></script></body></html>
