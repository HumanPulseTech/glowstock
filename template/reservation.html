<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réserver — GlowStock</title><style>body{margin:0;background:#f7f8f5;color:#26342b;font:16px system-ui,sans-serif}.wrap{max-width:620px;margin:48px auto;padding:28px;background:#fff;border:1px solid #dfe5dc;border-radius:24px}h1{margin:0 0 8px;font-size:32px}label{display:grid;gap:6px;margin-top:14px;font-weight:700}input,select,button{font:inherit;padding:12px;border:1px solid #ccd7cb;border-radius:10px}button{background:#829a85;color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:20px}.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.slots button{margin:0;background:#eef3ed;color:#26342b}.slots button[aria-pressed=true]{background:#26342b;color:#fff}.msg{min-height:24px;color:#a14337}.small{color:#657268;font-size:13px}</style></head><body><main class="wrap"><p class="small">RÉSERVATION EN LIGNE</p><h1 id="salon">Chargement…</h1><p id="intro">Choisis une prestation puis un créneau.</p><form id="booking"><label>Prestation<select name="serviceId" id="service" required></select></label><label>Date<input name="date" id="date" type="date" required></label><div><strong>Créneau</strong><div id="slots" class="slots" role="group"></div><input name="start" id="start" type="hidden" required></div><label>Nom<input name="name" maxlength="150" autocomplete="name" required></label><label>E-mail<input name="email" type="email" maxlength="254" autocomplete="email" required></label><label>Téléphone (facultatif)<input name="phone" maxlength="40" autocomplete="tel"></label><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px"><button>Confirmer la réservation</button></form><p id="msg" class="msg" role="status"></p></main><script src="/js/reservation.js"></script></body></html>
